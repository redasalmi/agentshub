[package]
name = "agentshub-ui"
version = "0.19.1"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
uuid = { version = "1", features = ["v4"] }
zbus = "5"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
agentshub-platform = { path = "../agentshub-platform", version = "0.19.1" }
agentshub-app = { path = "../agentshub-app", version = "0.19.1" }
agentshub-core = { path = "../agentshub-core", version = "0.19.1" }
agentshub-runtime = { path = "../agentshub-runtime", version = "0.19.1" }
agentshub-ui-kit = { path = "../agentshub-ui-kit", version = "0.19.1" }
gpui-kit = "0.8.0"
jiff = "0.2.38"

[lints]
workspace = true
