[package]
name = "agentshub-ui"
version = "0.15.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
uuid = { version = "1", features = ["v4"] }
zbus = "5"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
notify = "8"
agentshub-platform = { path = "../agentshub-platform" }
agentshub-app = { path = "../agentshub-app" }
agentshub-core = { path = "../agentshub-core" }
anyhow = "1"
gpui-kit = "0.8.0"
jiff = "0.2.38"
libghostty-vt = "0.2.2"
portable-pty = "0.9"
serde_json = "1"
smol = "2"
unicode-segmentation = "1"

[lints]
workspace = true
