[package]
name = "agentshub-ui-classic"
version = "0.20.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
agentshub-platform = { path = "../agentshub-platform", version = "0.20.0" }
agentshub-app = { path = "../agentshub-app", version = "0.20.0" }
agentshub-core = { path = "../agentshub-core", version = "0.20.0" }
agentshub-runtime = { path = "../agentshub-runtime", version = "0.20.0" }
agentshub-ui-kit = { path = "../agentshub-ui-kit", version = "0.20.0" }
gpui-kit = "0.8.0"

[lints]
workspace = true
