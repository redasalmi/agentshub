# Builds the Linux release and, for a version tag, publishes it as a GitHub
# release that install.sh downloads.
#
#   git tag v0.1.0 && git push origin v0.1.0   -> builds and publishes v0.1.0
#   Actions tab -> Release -> Run workflow     -> builds only, as an artifact
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  linux:
    needs: ci
    # The oldest supported runner, so the binary links against an old glibc
    # and runs on older distros too.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ASSET: agentshub-x86_64-linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev

      # Zig, which builds Ghostty's VT library, at the version in mise.toml.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir "$ASSET"
          cp target/release/agentshub assets/agentshub.desktop assets/agentshub.svg "$ASSET"/
          tar -czf "$ASSET.tar.gz" "$ASSET"
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.tar.gz*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "$ASSET.tar.gz" "$ASSET.tar.gz.sha256"
