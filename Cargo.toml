[package]
name = "agentshub"
version = "0.15.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1"
gpui-kit = "0.8.0"
jiff = "0.2.38"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
libghostty-vt = "0.2.2"
libc = "0.2"
notify = "8"
portable-pty = "0.9"
raw-window-handle = "0.6"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
smol = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
zbus = "5"

[lints.clippy]
string_slice = "warn"
unwrap_used = "warn"
get_unwrap = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
unchecked_time_subtraction = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
await_holding_refcell_ref = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Dependencies are built optimized even in dev builds: GPUI and the terminal
# are far too slow unoptimized, and they rarely need a debugger.
[profile.dev.package."*"]
opt-level = 3

# Its build script compiles Ghostty in Zig's Debug mode whenever debug info is
# on, which parses terminal output orders of magnitude slower.
[profile.dev.package.libghostty-vt-sys]
debug = false

# An opt-in profile for quick loop: `cargo run --profile dev-fast`.
# Everything it builds is unoptimized, GPUI and the terminal included, so it is
# slower at runtime but rebuilds in a fraction of the time.
[profile.dev-fast]
inherits = "dev"

[profile.dev-fast.package."*"]
opt-level = 0
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
